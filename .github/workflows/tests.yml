
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No install step on purpose: the suite stubs the Google client
      # libraries, so a regression run needs nothing but the interpreter.
      - name: Run the regression suite
        run: ppython3 tests/run_tests.py
